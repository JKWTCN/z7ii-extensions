<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z 7II 构图参考图转换</title>
<style>
  :root {
    color-scheme: dark;
    font: 16px/1.55 system-ui, sans-serif;
    background: #141615;
    color: #f1f2ec;
    --muted: #b2b8b1;
    --border: #3b423d;
    --accent: #c8ea8e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(100% - 2rem, 64rem); margin: clamp(2rem, 8vh, 6rem) auto; }
  header { margin-bottom: 1.75rem; }
  h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.65rem); line-height: 1.2; }
  header p { margin: .55rem 0 0; color: var(--muted); }
  header a { display: inline-block; margin-bottom: 1rem; color: var(--accent); }
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(17rem, 20rem); gap: 1rem; }
  .preview, .settings { min-width: 0; border: 1px solid var(--border); border-radius: .85rem; background: #1e221f; }
  .preview { margin: 0; padding: .75rem; }
  figcaption { padding: .15rem .25rem .7rem; }
  .frame {
    display: grid;
    place-items: center;
    aspect-ratio: 3/2;
    overflow: hidden;
    border-radius: .4rem;
    background: repeating-conic-gradient(#282d29 0 25%, #242824 0 50%) 0 0 / 24px 24px;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  [hidden] { display: none !important; }
  .placeholder { margin: 0; padding: .85rem; color: var(--muted); text-align: center; }
  .settings { display: flex; flex-direction: column; align-items: stretch; gap: 1.25rem; padding: 1.25rem; }
  button { font: inherit; font-weight: 650; border: 1px solid var(--border); border-radius: .45rem; cursor: pointer; padding: .65rem .9rem; }
  #choose { width: 100%; background: #2c342d; color: inherit; }
  #choose:hover { background: #374338; }
  #status { min-height: 1.4em; margin: .55rem 0 0; color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
  #status.error { color: #ffb8a8; }
  fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: .55rem; }
  .edit label { display: flex; justify-content: space-between; gap: .5rem; }
  .edit input { width: 100%; margin: .35rem 0 .7rem; accent-color: var(--accent); }
  .edit output { font-variant-numeric: tabular-nums; color: var(--muted); }
  .edit-actions { display: flex; flex-wrap: wrap; gap: .4rem; }
  .edit-actions button { padding: .5rem .65rem; }
  .slots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .35rem; }
  .slots label { position: relative; }
  .slots input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
  .slots span { display: grid; place-items: center; min-height: 2.65rem; border: 1px solid var(--border); border-radius: .4rem; font-variant-numeric: tabular-nums; }
  .slots label:hover span { border-color: var(--muted); }
  .slots input:checked + span { background: #33422e; border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible, .slots input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }
  .export { margin-top: auto; }
  button { background: #2c342d; color: inherit; }
  .export button { width: 100%; }
  .export button + button { margin-top: .5rem; }
  .export .primary { background: var(--accent); border-color: var(--accent); color: #192616; }
  .export .primary:hover:not(:disabled) { background: #ddf7b3; }
  button:disabled, fieldset:disabled { opacity: .5; cursor: default; }
  .destination { margin: .65rem 0 0; color: var(--muted); font-size: .88rem; }
  @media (max-width: 43rem) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<main>
  <header>
    <a id="back" href="/" hidden>← 返回相册</a>
    <h1>构图参考图</h1>
  </header>
  <div class="workspace">
    <figure class="preview">
      <figcaption id="preview-label">取景构图预览</figcaption>
      <div class="frame">
        <p class="placeholder" id="placeholder">选择 JPG 或 PNG 查看预览</p>
        <canvas id="preview" width="360" height="240" tabindex="0" aria-labelledby="preview-label" aria-describedby="gesture" hidden></canvas>
      </div>
      <p class="destination" id="gesture">拖动移动图片，双指捏合缩放。也可以用方向键移动。</p>
    </figure>
    <section class="settings" aria-label="参考图设置">
      <div>
        <input id="file" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden>
        <button id="choose" type="button">选择 JPG 或 PNG</button>
        <p id="status" role="status"></p>
      </div>
      <fieldset class="edit" id="edit" disabled>
        <legend>调整构图</legend>
        <label for="zoom">缩放 <output id="zoom-value" for="zoom">100%</output></label>
        <input id="zoom" type="range" min="25" max="500" value="100">
        <label for="angle">旋转 <output id="angle-value" for="angle">0°</output></label>
        <input id="angle" type="range" min="-180" max="180" value="0">
        <div class="edit-actions">
          <button id="left" type="button">左转 90°</button>
          <button id="right" type="button">右转 90°</button>
          <button id="reset" type="button">重置</button>
        </div>
      </fieldset>
      <fieldset id="slot-picker">
        <legend>参考图槽位</legend>
        <div class="slots">
          <label><input type="radio" name="slot" value="1" checked><span>1</span></label>
          <label><input type="radio" name="slot" value="2"><span>2</span></label>
          <label><input type="radio" name="slot" value="3"><span>3</span></label>
          <label><input type="radio" name="slot" value="4"><span>4</span></label>
          <label><input type="radio" name="slot" value="5"><span>5</span></label>
          <label><input type="radio" name="slot" value="6"><span>6</span></label>
        </div>
      </fieldset>
      <div class="export">
        <button id="upload" class="primary" type="button" disabled hidden>保存到 1 号槽位</button>
        <button id="download" type="button" disabled>下载 Z72REF1.RFG</button>
        <p id="destination" class="destination">把下载的文件放到相机 SD 卡根目录。</p>
        <p id="save-status" class="destination" role="status"></p>
      </div>
    </section>
  </div>
</main>
<script>
  const el = id => document.getElementById(id);
  const fileInput = el('file'), preview = el('preview'), download = el('download'), upload = el('upload');
  const status = el('status'), saveStatus = el('save-status'), placeholder = el('placeholder');
  const zoom = el('zoom'), angle = el('angle'), slotPicker = el('slot-picker');
  const context = preview.getContext('2d', { willReadFrequently: true });
  const { width, height } = preview;
  const headerBytes = 128, stride = 368;
  const camera = location.protocol === 'http:' && location.pathname === '/reference';
  const pointers = new Map();
  let selection = 0, image = null, saving = false, sourceController;
  let fitWidth = 0, fitHeight = 0, x = 0, y = 0, scale = 1, degrees = 0;

  function slot() {
    return slotPicker.querySelector('input:checked').value;
  }

  function filename() {
    return `Z72REF${slot()}.RFG`;
  }

  function updateControls() {
    download.textContent = `下载 ${filename()}`;
    upload.textContent = `保存到 ${slot()} 号槽位`;
    download.disabled = upload.disabled = el('edit').disabled = !image || saving;
    el('choose').disabled = slotPicker.disabled = saving;
  }

  function render() {
    context.clearRect(0, 0, width, height);
    context.save();
    context.translate(x, y);
    context.rotate(degrees * Math.PI / 180);
    context.scale(scale, scale);
    context.imageSmoothingQuality = 'high';
    context.drawImage(image, -fitWidth / 2, -fitHeight / 2, fitWidth, fitHeight);
    context.restore();
    zoom.value = Math.round(scale * 100);
    angle.value = degrees;
    el('zoom-value').value = `${zoom.value}%`;
    el('angle-value').value = `${degrees}°`;
  }

  function reset() {
    x = Math.floor((width - fitWidth) / 2) + fitWidth / 2;
    y = Math.floor((height - fitHeight) / 2) + fitHeight / 2;
    scale = 1;
    degrees = 0;
    render();
  }

  async function isSupported(file) {
    const bytes = new Uint8Array(await file.slice(0, 8).arrayBuffer());
    const png = [137, 80, 78, 71, 13, 10, 26, 10];
    return png.every((byte, index) => byte === bytes[index]) ||
      (bytes[0] === 255 && bytes[1] === 216 && bytes[2] === 255);
  }

  async function decodeImage(file) {
    if (typeof createImageBitmap === 'function') {
      try {
        return await createImageBitmap(file, { imageOrientation: 'from-image' });
      } catch {
        // Older mobile browsers can decode the same blob in an image element.
      }
    }
    const element = new Image();
    const url = URL.createObjectURL(file);
    try {
      await new Promise((resolve, reject) => {
        element.onload = resolve;
        element.onerror = reject;
        element.src = url;
      });
      return element;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  async function showPreview(getFile, name) {
    const current = ++selection;
    if (sourceController) sourceController.abort();
    sourceController = new AbortController();
    image?.close?.();
    image = null;
    pointers.clear();
    preview.hidden = true;
    placeholder.hidden = false;
    saveStatus.textContent = '';
    updateControls();
    status.classList.remove('error');
    status.textContent = '正在读取图片…';
    try {
      const file = await getFile(sourceController.signal);
      if (!await isSupported(file)) {
        if (current !== selection) return;
        status.textContent = '请选择有效的 JPG 或 PNG 文件。';
        status.classList.add('error');
        return;
      }
      const decoded = await decodeImage(file);
      if (current !== selection) {
        decoded.close?.();
        return;
      }
      image = decoded;
      const fit = Math.min(width / image.width, height / image.height);
      fitWidth = Math.max(1, Math.round(image.width * fit));
      fitHeight = Math.max(1, Math.round(image.height * fit));
      reset();
      placeholder.hidden = true;
      preview.hidden = false;
      status.textContent = name;
      updateControls();
    } catch {
      if (current !== selection) return;
      status.textContent = '图片读取失败，请选择另一张 JPG 或 PNG。';
      status.classList.add('error');
    } finally {
      if (current === selection) sourceController = null;
    }
  }

  function encodeReference() {
    const pixels = context.getImageData(0, 0, width, height).data;
    const data = new Uint8Array(headerBytes + stride * height * 4);
    data.set([90, 82, 70, 49]); // ZRF1
    const header = new DataView(data.buffer);
    header.setUint32(4, width, true);
    header.setUint32(8, height, true);
    header.setUint32(12, stride, true);
    for (let row = 0; row < height; row++) {
      const start = row * width * 4;
      data.set(pixels.subarray(start, start + width * 4), headerBytes + row * stride * 4);
    }
    return new Blob([data], { type: 'application/octet-stream' });
  }

  function point(event) {
    const bounds = preview.getBoundingClientRect();
    return { x: (event.clientX - bounds.left) * width / bounds.width,
      y: (event.clientY - bounds.top) * height / bounds.height };
  }

  function gesture() {
    const [a, b] = pointers.values();
    return b ? { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, span: Math.hypot(a.x - b.x, a.y - b.y) }
      : { ...a, span: 0 };
  }

  preview.addEventListener('pointerdown', event => {
    if (!image || saving || event.button !== 0 || pointers.size >= 2) return;
    pointers.set(event.pointerId, point(event));
    preview.setPointerCapture(event.pointerId);
  });
  preview.addEventListener('pointermove', event => {
    if (!pointers.has(event.pointerId) || saving) return;
    const before = gesture();
    pointers.set(event.pointerId, point(event));
    const after = gesture();
    const next = before.span ? Math.max(0.25, Math.min(5, scale * after.span / before.span)) : scale;
    x = after.x + (x - before.x) * next / scale;
    y = after.y + (y - before.y) * next / scale;
    scale = next;
    render();
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    preview.addEventListener(type, event => pointers.delete(event.pointerId));
  }
  preview.addEventListener('keydown', event => {
    const direction = { ArrowLeft: [-1,0], ArrowRight: [1,0], ArrowUp: [0,-1], ArrowDown: [0,1] }[event.key];
    if (!image || saving || !direction) return;
    event.preventDefault();
    const step = event.shiftKey ? 12 : 3;
    x += step * direction[0];
    y += step * direction[1];
    render();
  });
  zoom.addEventListener('input', () => { scale = Number(zoom.value) / 100; render(); });
  angle.addEventListener('input', () => { degrees = Number(angle.value); render(); });
  el('left').addEventListener('click', () => {
    degrees = degrees < -90 ? degrees + 270 : degrees - 90;
    render();
  });
  el('right').addEventListener('click', () => {
    degrees = degrees > 90 ? degrees - 270 : degrees + 90;
    render();
  });
  el('reset').addEventListener('click', reset);
  el('choose').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const [file] = fileInput.files;
    fileInput.value = '';
    if (file && !saving) void showPreview(() => file, file.name);
  });
  slotPicker.addEventListener('change', () => {
    saveStatus.textContent = '';
    updateControls();
  });
  download.addEventListener('click', () => {
    const link = document.createElement('a');
    const url = URL.createObjectURL(encodeReference());
    link.href = url;
    link.download = filename();
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  upload.addEventListener('click', async () => {
    if (!camera || !image || saving) return;
    const target = slot();
    saving = true;
    updateControls();
    saveStatus.textContent = `正在上传到 ${target} 号槽位…`;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 45000);
    try {
      const response = await fetch(`/reference/${target}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' },
        body: encodeReference(), signal: controller.signal
      });
      if (response.ok) saveStatus.textContent = `已保存到相机的 ${target} 号槽位。`;
      else if (response.status === 500) saveStatus.textContent = 'SD 卡写入失败，请检查卡的空间和写保护后重试。';
      else saveStatus.textContent = '相机未确认保存，请重试。';
    } catch {
      saveStatus.textContent = '未收到保存确认，请检查相机热点连接后重试。';
    } finally {
      clearTimeout(timer);
      saving = false;
      updateControls();
    }
  });

  if (camera) {
    el('back').hidden = upload.hidden = false;
    el('destination').textContent = '上传会替换所选槽位的参考图。';
    const photo = location.hash.slice(1);
    if (/^[0-9a-f]{8}$/.test(photo)) {
      void showPreview(async signal => {
        const response = await fetch(`/preview/${photo}`, { signal });
        if (!response.ok) throw new Error('Preview unavailable');
        return response.blob();
      }, '相册照片');
    }
  } else download.classList.add('primary');
  updateControls();
</script>
</body>
</html>
