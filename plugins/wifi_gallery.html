<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>相机相册</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#161817;color:#f4f4ef}
*{box-sizing:border-box}body{max-width:52rem;margin:auto;padding:1rem}
header,nav{display:flex;align-items:center;justify-content:space-between;gap:.7rem}
.album-head{position:sticky;top:0;z-index:1;background:#161817;padding:.25rem 0 .75rem}
.tools{display:flex;gap:.45rem;flex-wrap:wrap;justify-content:flex-end}
h1{font-size:1.45rem;margin:.3rem 0 1rem}button,a,select,input[type=date]{font:inherit;color:inherit}
button,a.download,select,input[type=date]{border:1px solid #555d57;background:#272d29;border-radius:.5rem;padding:.65rem .85rem;text-decoration:none}
button:disabled,select:disabled,input:disabled,a[aria-disabled=true]{opacity:.4}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.8rem,1fr));gap:.55rem}
.tile{min-width:0;padding:0;overflow:hidden;text-align:left}
.tile[aria-pressed=true]{outline:2px solid #92c9a1;outline-offset:-2px;background:#304138}
.tile[aria-pressed=true] span::before{content:"✓ ";color:#b0e3bb}
.thumb,#preview{display:grid;place-items:center;background:#202420;color:#a6aca5}
.thumb{aspect-ratio:4/3}.thumb img{width:100%;height:100%;object-fit:contain}
.tile span{display:block;padding:.45rem;font-size:.72rem;overflow:hidden;text-overflow:ellipsis}
#message,#detailMessage,#selected{color:#c0c6bf}
.filters{display:flex;flex-wrap:wrap;gap:.45rem;margin:0 0 .55rem}
.filters label{display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.filters select{padding:.45rem .4rem}
#dateFilter{margin-bottom:.55rem}
#dateSummary{cursor:pointer;padding:.2rem 0}
.date-range{margin:.35rem 0 0;align-items:end}
.date-range label{display:grid;gap:.25rem;flex:1;min-width:8rem;max-width:12rem}
.date-range input,.date-range button{padding:.45rem .4rem}
.date-range input{width:100%;min-width:0}
#selection nav{flex-wrap:wrap}
#selection .tools{align-items:center;flex-wrap:nowrap;justify-content:flex-start;margin-left:auto;max-width:100%;overflow-x:auto;white-space:nowrap}
#selection label{display:flex;align-items:center;gap:.45rem}
@media(max-width:28rem){
  #selection .tools{gap:.3rem;font-size:.875rem}
  #selection label{gap:.3rem}
  #selection .tools :is(button,a,select){padding:.55rem .25rem}
}
#listEnd{min-height:1px}
#preview{margin:.8rem 0;min-height:9rem}#preview img,#preview canvas{width:100%;max-height:72vh;object-fit:contain}
#downloads{display:flex;flex-wrap:wrap;gap:.55rem}#detailName{overflow-wrap:anywhere}
[hidden]{display:none!important}
</style>
<section id="album"><div class="album-head"><header><h1>相机相册</h1><div class="tools">
<a class="download" href="/reference">构图参考图</a>
<button id="select">多选</button><button id="refresh">刷新</button></div></header>
<div class="filters">
<label>存储卡 <select id="card"><option value="0">全部</option>
<option value="1">CFexpress / XQD</option><option value="2">SD</option></select></label>
<label>星级 <select id="rating"><option value="0">不限</option><option value="1">无评级</option>
<option value="2">1 星</option><option value="3">2 星</option><option value="4">3 星</option>
<option value="5">4 星</option><option value="6">5 星</option></select></label>
<label>保护 <select id="protection"><option value="0">不限</option>
<option value="1">仅已保护</option><option value="2">仅未保护</option></select></label>
</div>
<details id="dateFilter"><summary id="dateSummary">拍摄日期</summary>
<div class="filters date-range">
<label>起始日期 <input type="date" id="dateFrom" min="2000-01-01" max="2099-12-31"></label>
<label>结束日期 <input type="date" id="dateTo" min="2000-01-01" max="2099-12-31"></label>
<button id="clearDates" hidden>清除日期</button>
</div></details>
<div id="selection" hidden><nav><span id="selected" role="status"></span>
<div class="tools">
<label>格式 <select id="downloadFormat"><option value="all" selected>JPG + RAW</option>
<option value="jpg">只下载 JPG</option><option value="nef">只下载 RAW</option></select></label>
<button id="direct" disabled>下载所选</button>
<a class="download" id="zip" download="Z72-Photos.zip" aria-disabled="true">打包 ZIP</a></div></nav>
<p id="directMessage" role="status" hidden></p></div></div>
<div id="grid"></div><div id="listEnd"><p id="message" role="status"></p>
<button id="retry" hidden>重试加载</button></div></section>
<section id="detail" hidden><header><button id="back">返回相册</button><span id="detailName"></span></header>
<div id="preview"></div><p id="detailMessage" role="status"></p><div id="downloads"></div></section>
<script>
const el=id=>document.getElementById(id);
function photoLabel(photo){
  const name=photo.jpg&&photo.nef ? photo.name.slice(0,-4)+' · JPG + NEF' : photo.name;
  return name+' · '+(photo.card===0?'CFexpress / XQD':'SD');
}
const selected=new Map(),fileLimit=128;
let next='',more=true,failedPage=false,selecting=false,scrollPosition=0;
let listController=null;
let thumbs=[],thumbJob=null,pendingPreview=null;
let directRunning=false,directStopped=false,directController=null;
let nextToken=(Math.random()*0xffffffff)>>>0;
function photoFiles(photo,format){
  const files=[];
  if(photo.jpg&&format!=='nef')files.push(photo.id+'j');
  if(photo.nef&&format!=='jpg')files.push(photo.id+'n');
  return files;
}
function selectedFiles(){
  const format=el('downloadFormat').value;
  return Array.from(selected.values()).flatMap(photo=>photoFiles(photo,format));
}
function updateSelection(){
  const files=selectedFiles(),zip=el('zip');
  const count=files.length,canDownload=count>0&&count<=fileLimit;
  el('selected').textContent='已选 '+selected.size+' 张 · '+
    (selected.size&&!count?'当前格式无文件':count+' 个原文件')+
    (count>fileLimit?'（单次最多 '+fileLimit+' 个）':'');
  el('downloadFormat').disabled=directRunning;
  el('direct').disabled=!directRunning&&!canDownload;
  el('direct').textContent=directRunning?'停止后续':'下载所选';
  el('select').disabled=directRunning;
  el('card').disabled=el('rating').disabled=el('protection').disabled=directRunning;
  el('dateFrom').disabled=el('dateTo').disabled=el('clearDates').disabled=directRunning;
  el('refresh').disabled=!!listController||directRunning;
  const canZip=canDownload&&!directRunning;
  zip.setAttribute('aria-disabled',String(!canZip));
  if(canZip)zip.href='/zip/'+files.join(',');
  else zip.removeAttribute('href');
}
function selectionMode(enabled){
  selecting=enabled;
  selected.clear();
  el('selection').hidden=!enabled;
  el('directMessage').hidden=true;
  el('select').textContent=enabled?'取消多选':'多选';
  for(const tile of el('grid').children){
    if(enabled)tile.setAttribute('aria-pressed','false');
    else tile.removeAttribute('aria-pressed');
  }
  updateSelection();
}
function selectPhoto(photo,tile){
  if(directRunning)return;
  if(selected.has(photo.id))selected.delete(photo.id);
  else{
    if(selectedFiles().length+photoFiles(photo,el('downloadFormat').value).length>fileLimit){
      el('selected').textContent='每次最多 '+fileLimit+' 个原文件';
      return;
    }
    selected.set(photo.id,photo);
  }
  tile.setAttribute('aria-pressed',String(selected.has(photo.id)));
  updateSelection();
}
async function directStatus(token){
  const deadline=Date.now()+30000;
  while(!directStopped){
    const controller=new AbortController();
    directController=controller;
    const timer=setTimeout(()=>controller.abort(),180000);
    try{
      const response=await fetch('/direct-status/'+token,{signal:controller.signal});
      if(response.ok){
        const status=await response.text();
        if(status==='1'||status==='2')return status;
      }
    }catch(error){
      // A temporary connection error can be retried without resending a file.
    }finally{
      clearTimeout(timer);
      directController=null;
    }
    if(directStopped||Date.now()>=deadline)break;
    await new Promise(resolve=>setTimeout(resolve,750));
  }
  return '0';
}
async function downloadSelected(){
  if(directRunning){
    directStopped=true;
    if(directController)directController.abort();
    return;
  }
  const files=selectedFiles();
  if(!files.length||files.length>fileLimit)return;
  directRunning=true;directStopped=false;
  pauseThumbs();updateSelection();
  const message=el('directMessage');
  message.hidden=false;
  let sent=0,status='1';
  for(const file of files){
    nextToken=((nextToken+1)>>>0)||1;
    const token=nextToken.toString(16).padStart(8,'0');
    message.textContent='相机正在发送 '+(sent+1)+' / '+files.length+'，请允许浏览器下载。';
    const link=document.createElement('a');
    link.href='/direct/'+token+'/'+file;
    link.download='';
    link.hidden=true;
    document.body.append(link);
    link.click();
    link.remove();
    status=await directStatus(token);
    if(status!=='1')break;
    ++sent;
    if(directStopped)break;
  }
  const summary='相机已发送 '+sent+' / '+files.length+' 个文件。';
  message.textContent=summary+(directStopped?' 已停止后续下载。':
    status==='2'?' 相机传输失败。':
    status==='0'?' 等待下载超时，请检查热点连接和浏览器的自动下载权限。':' 请在浏览器下载列表查看。');
  directRunning=false;
  updateSelection();
  nextThumb();
  checkForMore();
}
function retryThumb(item,queue){
  if(item.retried)item.thumb.textContent='缩略图读取失败';
  else{item.retried=true;queue.push(item);}
}
function showThumb(item,blob){
  const {image,thumb}=item;
  const url=URL.createObjectURL(blob);
  image.onload=()=>{image.hidden=false;URL.revokeObjectURL(url);};
  image.onerror=()=>{thumb.textContent='缩略图读取失败';URL.revokeObjectURL(url);};
  image.src=url;
}
function pauseThumbs(){
  if(!thumbJob)return;
  thumbJob.paused=true;
  thumbJob.controller.abort();
}
async function nextThumb(){
  if(listController||directRunning||thumbJob||!el('detail').hidden||!thumbs.length)return;
  const queue=thumbs,batch=queue.splice(0,1);
  if(!batch[0].retried)
    while(batch.length<6&&queue.length&&!queue[0].retried)batch.push(queue.shift());
  const job={controller:new AbortController(),paused:false};
  thumbJob=job;
  const timer=setTimeout(()=>job.controller.abort(),5000);
  try{
    const response=await fetch('/thumbs/'+batch.map(item=>item.photo.id).join(','),{signal:job.controller.signal});
    if(!response.ok)throw new Error(response.status);
    const data=await response.arrayBuffer(),view=new DataView(data);
    let offset=0;
    const records=batch.map(()=>{
      const length=view.getUint32(offset,true);
      offset+=4;
      if(length===0||length===0xffffffff)return length;
      if(length>data.byteLength-offset)throw new Error('Incomplete thumbnail');
      const blob=new Blob([new Uint8Array(data,offset,length)],{type:'image/jpeg'});
      offset+=length;
      return blob;
    });
    if(offset!==data.byteLength)throw new Error('Unexpected thumbnail data');
    batch.forEach((item,i)=>{
      const record=records[i];
      if(record===0)item.thumb.textContent='无缩略图';
      else if(record===0xffffffff)retryThumb(item,queue);
      else showThumb(item,record);
    });
  }catch(error){
    if(job.paused)queue.unshift(...batch);
    else for(const item of batch)retryThumb(item,queue);
  }finally{
    clearTimeout(timer);
    thumbJob=null;
    nextThumb();
  }
}
function cancelPreview(){
  if(!pendingPreview)return;
  pendingPreview.onload=pendingPreview.onerror=null;
  pendingPreview.removeAttribute('src');
  pendingPreview=null;
}
function showPreview(photo,route){
  cancelPreview();
  const preview=el('preview'),message=el('detailMessage');
  message.textContent='正在读取预览…';
  const image=new Image();
  pendingPreview=image;
  image.alt=photo.name;
  image.onload=()=>{
    pendingPreview=null;
    preview.replaceChildren(image);
    message.textContent='';
  };
  image.onerror=()=>{
    pendingPreview=null;
    message.textContent='这张照片暂无可用预览';
  };
  image.src='/'+route+'/'+photo.id;
}
function detail(photo,thumbnail){
  scrollPosition=window.scrollY;
  el('detailName').textContent=photoLabel(photo);
  el('album').hidden=true;el('detail').hidden=false;
  pauseThumbs();
  const preview=el('preview'),actions=el('downloads');
  preview.replaceChildren();actions.replaceChildren();
  if(thumbnail.complete&&thumbnail.naturalWidth){
    const image=document.createElement('canvas');
    image.width=thumbnail.naturalWidth;image.height=thumbnail.naturalHeight;
    image.setAttribute('role','img');image.setAttribute('aria-label',photo.name);
    image.getContext('2d').drawImage(thumbnail,0,0);
    preview.append(image);
  }
  showPreview(photo,'preview');
  const reference=document.createElement('a');
  reference.className='download';reference.href='/reference#'+photo.id;
  reference.textContent='用作构图参考';
  actions.append(reference);
  if(photo.jpg){
    const full=document.createElement('button');
    full.textContent='查看全尺寸 JPG';
    full.onclick=()=>showPreview(photo,'view-jpg');
    actions.append(full);
  }
  for(const format of ['jpg','nef']){
    if(!photo[format])continue;
    const link=document.createElement('a');
    link.className='download';link.href='/'+format+'/'+photo.id;
    link.textContent='下载 '+format.toUpperCase()+' 原图';
    actions.append(link);
  }
}
el('back').onclick=()=>{
  cancelPreview();
  el('preview').replaceChildren();el('detail').hidden=true;el('album').hidden=false;
  window.scrollTo(0,scrollPosition);
  nextThumb();
  checkForMore();
};
function checkForMore(){
  if(more&&!listController&&!directRunning&&!failedPage&&el('detail').hidden&&
     el('listEnd').getBoundingClientRect().top<=window.innerHeight+160)load();
}
function clearGallery(){
  thumbs=[];
  el('grid').replaceChildren();
  selectionMode(false);
  window.scrollTo(0,0);
}
async function load(reset=false){
  if(directRunning||(!reset&&(listController||!more)))return;
  if(listController)listController.abort();
  if(reset)pauseThumbs();
  const cursor=reset?'':next;
  const dateFrom=el('dateFrom'),dateTo=el('dateTo'),start=dateFrom.value,end=dateTo.value;
  const hasDates=!!(start||end);
  el('clearDates').hidden=!hasDates;
  el('dateSummary').textContent=hasDates?'拍摄日期 '+(start||'不限')+' 至 '+(end||'不限'):'拍摄日期';
  const dateError=!dateFrom.validity.valid||!dateTo.validity.valid?'请选择 2000 至 2099 年的有效日期':
    start&&end&&start>end?'起始日期不能晚于结束日期':'';
  el('retry').hidden=true;
  if(dateError){
    listController=null;failedPage=true;el('refresh').disabled=false;
    el('dateFilter').open=true;el('message').textContent=dateError;
    return;
  }
  const controller=new AbortController();
  listController=controller;
  el('refresh').disabled=true;
  const filters=el('rating').value+el('protection').value;
  const card=el('card').value;
  const filtered=filters!=='00'||card!=='0'||hasDates;
  const cardFilter=card==='0'?'':'/card/'+card;
  const dates=hasDates?'/dates/'+(start||'0')+'/'+(end||'0'):'';
  const path='/photos'+(filtered?'/filter/'+filters+cardFilter+dates:'')+(cursor?'/'+cursor:'');
  const timer=setTimeout(()=>controller.abort(),8000);
  el('message').textContent='正在读取照片…';
  try{
    const response=await fetch(path,{signal:controller.signal});
    if(!response.ok)throw new Error(response.status);
    const data=await response.json();
    if(listController!==controller)return;
    const tiles=document.createDocumentFragment();
    if(reset)clearGallery();
    for(const photo of data.items){
      const button=document.createElement('button');
      button.className='tile';
      const thumb=document.createElement('div');
      thumb.className='thumb';
      const image=new Image();
      image.alt='';image.decoding='async';image.hidden=true;
      if(selecting)button.setAttribute('aria-pressed','false');
      button.onclick=()=>selecting?selectPhoto(photo,button):detail(photo,image);
      const caption=document.createElement('span');
      caption.textContent=photoLabel(photo);
      thumb.append(image);button.append(thumb,caption);tiles.append(button);
      thumbs.push({photo,image,thumb});
    }
    el('grid').append(tiles);
    next=data.next;more=!!next&&next!==cursor;failedPage=false;
    el('message').textContent=el('grid').children.length||more?'':
      filtered?'没有符合筛选条件的照片':'没有照片';
  }catch(error){
    if(listController!==controller)return;
    failedPage=true;el('retry').hidden=false;
    el('retry').onclick=()=>load(reset);
    el('message').textContent='读取失败，请检查热点连接后重试';
  }
  finally{
    clearTimeout(timer);
    if(listController===controller){
      listController=null;el('refresh').disabled=directRunning;
      nextThumb();
      window.requestAnimationFrame(checkForMore);
    }
  }
}
function filtersChanged(){
  clearGallery();
  load(true);
}
el('card').onchange=el('rating').onchange=el('protection').onchange=el('dateFrom').onchange=el('dateTo').onchange=filtersChanged;
el('clearDates').onclick=()=>{
  el('dateFrom').value=el('dateTo').value='';
  filtersChanged();
};
el('refresh').onclick=()=>load(true);
el('select').onclick=()=>selectionMode(!selecting);
el('downloadFormat').onchange=updateSelection;
el('direct').onclick=downloadSelected;
window.addEventListener('scroll',checkForMore,{passive:true});
window.addEventListener('resize',checkForMore);
updateSelection();
load();
</script></html>
